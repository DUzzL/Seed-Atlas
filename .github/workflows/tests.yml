name: Tests

on: [pull_request, push]

permissions:
  contents: read

jobs:
  engine-versions:
    name: Engine version regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build version tests
        run: make -C seedatlas-engine test-versions
      - name: Run version tests
        run: ./seedatlas-engine/test-versions
      # The app links an engine built with these flags, so test that one too.
      - name: Build version tests with the app's engine flags
        run: |
          make -C seedatlas-engine clean
          make -C seedatlas-engine test-versions CFLAGS="-O3 -DSTRUCT_CONFIG_OVERRIDE=1"
      - name: Run version tests with the app's engine flags
        run: ./seedatlas-engine/test-versions

  sax-abi:
    name: Mod ABI (seedatlas-sax) tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up MinGW (C11 VLA support)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
      - name: Build and run the ABI tests (Unix)
        if: runner.os != 'Windows'
        run: make -C seedatlas-sax test
      - name: Build and run the ABI tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C seedatlas-sax test CC=gcc

  packaging-metadata:
    name: Packaging metadata regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify Flatpak Seed Atlas icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack

          manifest = Path("installer/flatpak/org.seedatlas.SeedAtlas.yml").read_text()
          expected = (
              "install -Dm644 rc/icons/logo.png "
              "/app/share/icons/hicolor/128x128/apps/"
              "org.seedatlas.SeedAtlas.png"
          )
          assert expected in manifest
          assert "etc/icon.svg /app/share/icons" not in manifest

          png = Path("rc/icons/logo.png").read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n"
          assert unpack(">II", png[16:24]) == (128, 128)
          PY
